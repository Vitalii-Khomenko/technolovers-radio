<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TL Radio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Technolovers Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: ambient dark glass, one big glowing orb on top, station cards below, player dock fixed at the bottom. Hue follows the active genre. */
:root {
  --bg: #0a0e1a;
  --bg2: #101733;
  --ink: #eaf0ff;
  --muted: #8f9bbd;
  --glass: rgba(255,255,255,.055);
  --glass-hi: rgba(255,255,255,.1);
  --line: rgba(255,255,255,.09);
  --h: 195;
  --accent: hsl(var(--h) 85% 68%);
  --accent-soft: hsl(var(--h) 85% 68% / .18);
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); color-scheme: dark; }
body { position: relative; overflow-x: hidden; padding-bottom: calc(112px + var(--safe-b)); }

/* ambient background */
.aura { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(120% 80% at 50% -10%, var(--bg2), var(--bg) 60%); }
.aura i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .5; transition: background 1.6s ease; animation: drift 26s ease-in-out infinite alternate; }
.aura i:nth-child(1) { width: 60vmax; height: 60vmax; left: -20vmax; top: -22vmax; background: hsl(var(--h) 80% 45%); }
.aura i:nth-child(2) { width: 50vmax; height: 50vmax; right: -18vmax; top: 18vh; background: hsl(calc(var(--h) + 55) 75% 42%); animation-duration: 34s; animation-delay: -8s; }
.aura i:nth-child(3) { width: 44vmax; height: 44vmax; left: 10vw; bottom: -24vmax; background: hsl(calc(var(--h) - 45) 70% 38%); animation-duration: 40s; animation-delay: -15s; }
@keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(6vmax,4vmax,0) scale(1.15); } }

main { position: relative; z-index: 1; width: min(1080px, 100%); margin: 0 auto; padding: 24px 16px 0; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand { font: 600 .8rem/1 var(--font-display); letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
.brand b { color: var(--accent); font-weight: 600; }
.count { font-size: .8rem; color: var(--muted); }

/* hero */
.hero { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 34px 0 26px; }
.orb-wrap { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
.orb { width: 124px; height: 124px; border-radius: 50%; background: radial-gradient(circle at 32% 28%, hsl(calc(var(--h) + 30) 90% 82%), hsl(var(--h) 85% 58%) 45%, hsl(calc(var(--h) - 30) 80% 28%) 100%); box-shadow: 0 0 60px hsl(var(--h) 90% 55% / .55), inset 0 -10px 30px rgba(0,0,0,.35); transition: box-shadow 1.2s, background 1.2s; animation: breathe 7s ease-in-out infinite; }
.orb-wrap::before, .orb-wrap::after { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1px solid hsl(var(--h) 90% 70% / .35); opacity: 0; }
body.playing .orb-wrap::before { animation: ring 4.2s ease-out infinite; }
body.playing .orb-wrap::after { animation: ring 4.2s ease-out 2.1s infinite; }
body.playing .orb { animation-duration: 3.6s; }
@keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes ring { 0% { transform: scale(.75); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }

.now-label { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
.now-name { margin: 0; font: 300 clamp(1.7rem, 6vw, 2.8rem)/1.1 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.now-sub { margin: 0; color: var(--muted); font-size: .95rem; min-height: 1.3em; }
.now-sub.err { color: #ff9b8a; }

.bars { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 28px; margin-top: 4px; }
.bars span { width: 3px; height: 100%; border-radius: 2px; background: var(--accent); transform: scaleY(.12); transform-origin: bottom; opacity: .75; transition: transform .4s; }
body.playing .bars span { animation: eq 1.1s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.13s); }
@keyframes eq { 0% { transform: scaleY(.15); } 50% { transform: scaleY(.9); } 100% { transform: scaleY(.3); } }

/* controls bar */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.search svg { flex: none; opacity: .6; }
.search input { all: unset; width: 100%; padding: 12px 0; font-size: .95rem; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; margin-bottom: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; cursor: pointer; border: 1px solid var(--line); background: var(--glass); color: var(--muted); font: 500 .85rem var(--font-body); padding: 9px 15px; border-radius: 999px; transition: .2s; }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { color: #07101c; background: var(--accent); border-color: transparent; font-weight: 700; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; padding-bottom: 8px; }
.card-wrap { position: relative; display: flex; }
.card { width: 100%; position: relative; text-align: left; cursor: pointer; border: 1px solid var(--line); background: var(--glass); color: var(--ink); border-radius: 20px; padding: 16px 14px 14px; min-height: 118px; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: transform .2s, background .25s, border-color .25s, box-shadow .3s; font-family: inherit; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 90% at 0% 0%, hsl(var(--ch) 85% 60% / .22), transparent 65%); pointer-events: none; }
.card:hover { transform: translateY(-3px); background: var(--glass-hi); }
.card:focus-visible, .chip:focus-visible, .btn:focus-visible, .fav:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.active { border-color: hsl(var(--ch) 90% 70% / .8); box-shadow: 0 0 0 1px hsl(var(--ch) 90% 70% / .5), 0 10px 40px hsl(var(--ch) 90% 55% / .3); background: var(--glass-hi); }
.card .tag { position: relative; padding-right: 30px; font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: hsl(var(--ch) 85% 75%); }
.card .nm { position: relative; font: 600 1.05rem/1.2 var(--font-display); letter-spacing: -.005em; }
.card .bpm { position: relative; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.fav { position: absolute; top: 8px; right: 8px; z-index: 2; border: 0; background: transparent; color: var(--muted); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; transition: .2s; }
.fav:hover { color: var(--ink); background: var(--glass); }
.fav[aria-pressed="true"] { color: #ff7aa8; }
.fav[aria-pressed="true"] svg { fill: currentColor; }
.eqmini { position: absolute; left: 14px; bottom: 14px; display: none; gap: 2px; align-items: flex-end; height: 14px; }
.eqmini i { width: 3px; height: 100%; background: hsl(var(--ch) 90% 75%); border-radius: 1px; transform-origin: bottom; animation: eq .9s ease-in-out infinite alternate; }
.eqmini i:nth-child(2) { animation-delay: -.3s; } .eqmini i:nth-child(3) { animation-delay: -.6s; }
body.playing .card.active .eqmini { display: flex; }
body.playing .card.active .bpm { margin-left: 24px; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 0; }

footer.note { margin: 26px 0 8px; font-size: .78rem; color: var(--muted); line-height: 1.55; max-width: 62ch; }

/* dock */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(12px + var(--safe-b)); }
.dock-in { width: min(760px, 100%); margin: 0 auto; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 10px 14px; border-radius: 26px; background: rgba(14,19,40,.72); border: 1px solid var(--line); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.transport { display: flex; align-items: center; gap: 6px; }
.btn { border: 0; cursor: pointer; color: var(--ink); background: transparent; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; transition: .2s; font-family: inherit; }
.btn:hover { background: var(--glass-hi); }
.btn.play { width: 54px; height: 54px; background: var(--accent); color: #06101c; box-shadow: 0 0 28px hsl(var(--h) 90% 60% / .5); }
.btn.play:hover { transform: scale(1.06); background: var(--accent); }
.dock-info { min-width: 0; }
.dock-info .t { font: 600 .98rem/1.2 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dock-info .s { font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.dock-info .s.err { color: #ff9b8a; }
.side { display: flex; align-items: center; gap: 4px; }
.vol { display: flex; align-items: center; gap: 4px; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 96px; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--p, 80%), rgba(255,255,255,.16) var(--p, 80%)); outline: none; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 0 10px rgba(0,0,0,.5); }
input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 0; }
.sleep { font: 500 .78rem var(--font-body); width: auto; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); height: 34px; color: var(--muted); }
.sleep.on { color: var(--accent); border-color: var(--accent); }

@media (max-width: 560px) {
  .dock-in { grid-template-columns: auto 1fr; gap: 10px; }
  .side { grid-column: 1 / -1; justify-content: space-between; }
  .vol { flex: 1; } input[type=range] { width: 100%; max-width: 220px; }
  body { padding-bottom: calc(150px + var(--safe-b)); }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<main>
  <header class="top">
    <div class="brand">Techno<b>lovers</b> · Radio</div>
    <div class="count" id="count"></div>
  </header>

  <section class="hero" aria-live="polite">
    <div class="orb-wrap"><div class="orb"></div></div>
    <div class="now-label" id="nowLabel">Bereit</div>
    <h1 class="now-name" id="nowName">Wähle einen Sender</h1>
    <p class="now-sub" id="nowSub">Tippe auf eine Karte und es läuft sofort.</p>
    <div class="bars" id="bars" aria-hidden="true"></div>
  </section>

  <div class="tools">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Sender suchen" autocomplete="off" aria-label="Sender suchen">
    </label>
  </div>
  <nav class="chips" id="chips" aria-label="Kategorien"></nav>

  <section class="grid" id="grid" aria-label="Sender"></section>

  <footer class="note">
    Alle Streams kommen direkt von technolovers.fm (MP3, 192 kbit/s). Die App speichert Favoriten, Lautstärke und den zuletzt gehörten Sender nur in diesem Browser.
  </footer>
</main>

<div class="dock">
  <div class="dock-in">
    <div class="transport">
      <button class="btn" id="prev" aria-label="Vorheriger Sender"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button class="btn play" id="play" aria-label="Abspielen"><svg id="playIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="btn" id="next" aria-label="Nächster Sender"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
    </div>
    <div class="dock-info">
      <div class="t" id="dockT">Kein Sender gewählt</div>
      <div class="s" id="dockS">Technolovers.fm</div>
    </div>
    <div class="side">
      <div class="vol">
        <button class="btn" id="mute" aria-label="Stumm schalten" style="width:36px;height:36px"><svg id="volIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
        <input type="range" id="vol" min="0" max="100" value="80" aria-label="Lautstärke">
      </div>
      <button class="btn sleep" id="sleep" aria-label="Einschlaf-Timer">Timer aus</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- Stationen ---------- */
  // cat: Kategorie, h: Farbton, bpm: Tempo laut Sender, slug: Pfad auf stream.technolovers.fm
  var CATS = [
    { id: "all",   name: "Alle" },
    { id: "fav",   name: "Favoriten" },
    { id: "chill", name: "Chill & Lounge", h: 190 },
    { id: "house", name: "House",          h: 265 },
    { id: "trance",name: "Trance",         h: 292 },
    { id: "techno",name: "Techno",         h: 218 },
    { id: "dance", name: "Dance & EDM",    h: 330 },
    { id: "hard",  name: "Hard & Bass",    h: 12 }
  ];
  var HUE = {}; CATS.forEach(function (c) { if (c.h != null) HUE[c.id] = c.h; });

  var S = [
    // Chill & Lounge
    st("Lounge", "chill", "110–120 BPM", "lounge", "Ambient Chillout"),
    st("Ibiza House", "chill", "120–128 BPM", "ibiza-house", "Balearic Chill"),
    st("Tropical House", "chill", "115–125 BPM", "tropical-house", "Easy Listening"),
    st("Deep House", "chill", "120–128 BPM", "deep-house", "Deep & Warm"),
    st("Melodic House & Techno", "chill", "124–128 BPM", "melodic-house-techno", "Beach & Sundowner"),
    st("Minimal", "chill", "Minimal", "minimal", "Reduziert & Hypnotisch"),
    // House
    st("House", "house", "House", "house", "Klassisch"),
    st("Electro House", "house", "Electro House", "electro-house", "Club"),
    st("Tech House", "house", "Tech House", "techhouse", "Groove"),
    st("Bass House", "house", "Bass House", "bass-house", "Druckvoll"),
    st("Funky House", "house", "Funky House", "funky-house", "Funk & Groove"),
    st("Dirty House", "house", "Dirty House", "dirty-house", "Roh"),
    st("Afro House", "house", "Afro House", "afro-house", "Percussion"),
    st("Latin House", "house", "Latin House", "latin-house", "Latin Flavour"),
    st("Future House", "house", "Future House", "future-house", "Modern"),
    st("Big Room", "house", "Big Room", "big-room", "Festival-Drops"),
    // Trance
    st("Trance", "trance", "128–140 BPM", "trance", "Klassiker"),
    st("Vocal Trance", "trance", "125–140 BPM", "vocal-trance", "Mit Gesang"),
    st("Uplifting Trance", "trance", "Uplifting", "uplifting-trance", "Euphorisch"),
    st("Psytrance", "trance", "130–150 BPM", "psytrance", "Psychedelisch"),
    // Techno
    st("Techno", "techno", "Techno", "techno", "Ambient bis Hard"),
    st("Hypertechno", "techno", "Hypertechno", "hypertechno", "Hart & schnell"),
    // Dance & EDM
    st("EDM", "dance", "EDM", "edm", "Club & Dance"),
    st("Electro", "dance", "Electro", "electro", "Electronic"),
    st("Melbourne Bounce", "dance", "Melbourne Bounce", "melbourne-bounce", "Bounce"),
    st("Festival Sounds", "dance", "Festival", "festival-sounds", "Mainstage"),
    st("Eurodance", "dance", "Eurodance", "eurodance", "90er & Euro"),
    st("Handsup", "dance", "Handsup", "handsup", "Hands Up"),
    st("Trap", "dance", "Trap", "trap", "Heavy Beats"),
    // Hard & Bass
    st("Hardstyle", "hard", "Hardstyle", "hardstyle", "Kicks"),
    st("Hardcore", "hard", "Hardcore", "hardcore", "Ultra hart"),
    st("Frenchcore", "hard", "Frenchcore", "frenchcore", "Frenchcore"),
    st("Gabber", "hard", "Gabber", "gabber", "Old School"),
    st("Drum & Bass", "hard", "Drum & Bass", "drum-n-bass", "Breakbeat")
  ];
  function st(name, cat, bpm, slug, tag) { return { id: slug, name: name, cat: cat, bpm: bpm, slug: slug, tag: tag }; }

  // Stream-Adresse: Hauptpfad zuerst, danach Schreibvarianten als Rückfall
  function urlsFor(s) {
    var base = "https://stream.technolovers.fm/";
    var list = [base + s.slug];
    var flat = s.slug.replace(/-/g, "");
    if (flat !== s.slug) list.push(base + flat);
    list.push(base + "technolovers-" + s.slug);
    return list;
  }

  /* ---------- Zustand ---------- */
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem("tl_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem("tl_" + k, JSON.stringify(v)); } catch (e) {} }
  };
  var favs = store.get("favs", []);
  var good = store.get("good", {});      // merkt sich je Sender die funktionierende Adresse
  var current = null, filter = "all", query = "", tryIdx = 0, wantPlay = false, failedAll = false;

  var audio = new Audio();
  audio.preload = "none";
  audio.crossOrigin = null;

  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), chips = $("chips");

  /* ---------- Rendern ---------- */
  var heartSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-8-4.9-9.4-10C1.7 7 3.8 4.5 6.7 4.5c1.9 0 3.600 1 5.300 3 1.700-2 3.400-3 5.300-3 2.900 0 5 2.500 4.100 6-1.400 5.100-9.400 10-9.400 10z"/></svg>';

  function renderChips() {
    chips.innerHTML = CATS.map(function (c) {
      var n = c.id === "all" ? S.length : c.id === "fav" ? favs.length : S.filter(function (s) { return s.cat === c.id; }).length;
      return '<button class="chip" data-cat="' + c.id + '" aria-pressed="' + (filter === c.id) + '">' + c.name + ' <span style="opacity:.6">' + n + '</span></button>';
    }).join("");
  }

  function visible() {
    var q = query.trim().toLowerCase();
    return S.filter(function (s) {
      if (filter === "fav" && favs.indexOf(s.id) < 0) return false;
      if (filter !== "all" && filter !== "fav" && s.cat !== filter) return false;
      if (q && (s.name + " " + s.tag + " " + s.bpm).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function renderGrid() {
    var list = visible();
    $("count").textContent = list.length + " von " + S.length + " Sendern";
    if (!list.length) {
      grid.innerHTML = '<div class="empty">' + (filter === "fav" ? "Noch keine Favoriten. Tippe auf das Herz einer Karte." : "Kein Sender gefunden.") + "</div>";
      return;
    }
    grid.innerHTML = list.map(function (s) {
      var isFav = favs.indexOf(s.id) >= 0;
      return '<div class="card-wrap">' +
        '<button class="card' + (current && current.id === s.id ? " active" : "") + '" data-id="' + s.id + '" style="--ch:' + HUE[s.cat] + '" aria-label="' + s.name + ' abspielen">' +
          '<span class="tag">' + s.tag + '</span>' +
          '<span><span class="nm">' + s.name + '</span><br><span class="bpm">' + s.bpm + '</span></span>' +
          '<span class="eqmini"><i></i><i></i><i></i></span>' +
        '</button>' +
        '<button class="fav" data-fav="' + s.id + '" aria-pressed="' + isFav + '" aria-label="' + (isFav ? "Favorit entfernen" : "Als Favorit merken") + '">' + heartSvg + '</button>' +
      '</div>';
    }).join("");
  }
  // Karten-Wrapper nimmt die volle Zelle ein
  grid.addEventListener("click", function (e) {
    var f = e.target.closest("[data-fav]");
    if (f) { toggleFav(f.getAttribute("data-fav")); return; }
    var c = e.target.closest("[data-id]");
    if (c) select(c.getAttribute("data-id"), true);
  });
  chips.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]"); if (!b) return;
    filter = b.getAttribute("data-cat"); renderChips(); renderGrid();
  });
  $("q").addEventListener("input", function (e) { query = e.target.value; renderGrid(); });

  function toggleFav(id) {
    var i = favs.indexOf(id);
    if (i >= 0) favs.splice(i, 1); else favs.push(id);
    store.set("favs", favs); renderChips(); renderGrid();
  }

  /* ---------- Player ---------- */
  function byId(id) { return S.filter(function (s) { return s.id === id; })[0]; }

  function setHue(cat) { document.documentElement.style.setProperty("--h", HUE[cat] != null ? HUE[cat] : 195); }

  function setStatus(text, isErr) {
    ["nowSub", "dockS"].forEach(function (id) { var el = $(id); el.textContent = text; el.classList.toggle("err", !!isErr); });
  }

  function select(id, autoplay) {
    var s = byId(id); if (!s) return;
    current = s; tryIdx = 0; failedAll = false;
    store.set("last", id);
    setHue(s.cat);
    $("nowName").textContent = s.name;
    $("dockT").textContent = "Technolovers " + s.name;
    $("nowLabel").textContent = s.tag;
    document.title = s.name + " · Technolovers Radio";
    renderGrid();
    updateMedia();
    if (autoplay) start();
    else setStatus("Bereit. Tippe auf Play.", false);
  }

  function candidate() {
    var list = urlsFor(current);
    var g = good[current.id];
    // Zuletzt funktionierende Adresse zuerst, danach die übrigen Varianten
    var order = (g && list.indexOf(g) >= 0) ? [g].concat(list.filter(function (u) { return u !== g; })) : list;
    return order[tryIdx] || null;
  }

  function start() {
    if (!current) return;
    wantPlay = true; failedAll = false;
    tryIdx = 0;                         // jeder neue Start beginnt wieder bei der ersten Adresse
    var url = candidate();
    if (!url) { fail(); return; }
    setStatus("Verbinde …", false);
    document.body.classList.remove("playing");
    audio.src = url;
    audio.load();
    var p = audio.play();
    if (p && p.catch) p.catch(function (err) {
      if (err && err.name === "NotAllowedError") { wantPlay = false; setStatus("Tippe auf Play, um zu starten.", false); syncPlayIcon(); }
    });
    syncPlayIcon();
  }

  function stop() {
    wantPlay = false;
    audio.pause();
    audio.removeAttribute("src");
    audio.load();                       // Live-Stream nicht weiter puffern
    document.body.classList.remove("playing");
    setStatus(current ? "Pausiert" : "Technolovers.fm", false);
    syncPlayIcon();
  }

  function fail() {
    wantPlay = false; failedAll = true;
    audio.removeAttribute("src");
    document.body.classList.remove("playing");
    setStatus("Stream nicht erreichbar. Wähle einen anderen Sender.", true);
    syncPlayIcon();
  }

  audio.addEventListener("playing", function () {
    document.body.classList.add("playing");
    setStatus("Live · 192 kbit/s", false);
    if (current) { good[current.id] = audio.currentSrc || audio.src; store.set("good", good); }
    if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing";
    syncPlayIcon();
  });
  audio.addEventListener("waiting", function () { if (wantPlay) setStatus("Puffert …", false); });
  audio.addEventListener("stalled", function () { if (wantPlay) setStatus("Verbindung wackelt …", false); });
  audio.addEventListener("error", function () {
    if (!wantPlay || !current) return;
    tryIdx++;
    var next = candidate();
    if (next) { audio.src = next; audio.load(); audio.play().catch(function () {}); setStatus("Verbinde …", false); }
    else fail();
  });
  audio.addEventListener("ended", function () { if (wantPlay) start(); }); // Stream abgebrochen: neu verbinden

  function toggle() {
    if (!current) {
      var last = byId(store.get("last", "")) || byId("lounge");
      select(last.id, true); return;
    }
    if (wantPlay) stop(); else start();
  }

  function step(dir) {
    var list = visible(); if (!list.length) list = S;
    var i = current ? list.map(function (s) { return s.id; }).indexOf(current.id) : -1;
    var n = list[(i + dir + list.length) % list.length];
    select(n.id, true);
    var el = grid.querySelector('[data-id="' + n.id + '"]'); if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  function syncPlayIcon() {
    var playing = wantPlay;
    $("playIcon").innerHTML = playing ? '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $("play").setAttribute("aria-label", playing ? "Pause" : "Abspielen");
  }

  $("play").addEventListener("click", toggle);
  $("next").addEventListener("click", function () { step(1); });
  $("prev").addEventListener("click", function () { step(-1); });
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    else if (e.code === "ArrowRight") step(1);
    else if (e.code === "ArrowLeft") step(-1);
  });
  // Leertaste löst auf einem fokussierten Button sonst zusätzlich dessen Klick aus (Doppel-Toggle)
  document.addEventListener("keyup", function (e) {
    if (e.code === "Space" && e.target.tagName !== "INPUT") e.preventDefault();
  });

  /* ---------- Lautstärke ---------- */
  var vol = $("vol"), muted = false;
  function applyVol() {
    var v = muted ? 0 : vol.value / 100;
    audio.volume = v;
    vol.style.setProperty("--p", vol.value + "%");
    $("volIcon").style.opacity = v === 0 ? .4 : 1;
  }
  vol.value = store.get("vol", 80);
  vol.addEventListener("input", function () { muted = false; store.set("vol", +vol.value); applyVol(); });
  $("mute").addEventListener("click", function () { muted = !muted; applyVol(); });
  applyVol();

  /* ---------- Einschlaf-Timer ---------- */
  var STEPS = [0, 15, 30, 60, 90], stepI = 0, sleepEnd = 0, sleepTick = null;
  $("sleep").addEventListener("click", function () {
    stepI = (stepI + 1) % STEPS.length;
    clearInterval(sleepTick);
    var btn = $("sleep");
    if (!STEPS[stepI]) { btn.textContent = "Timer aus"; btn.classList.remove("on"); return; }
    sleepEnd = Date.now() + STEPS[stepI] * 60000;
    btn.classList.add("on");
    function tick() {
      var left = Math.max(0, sleepEnd - Date.now());
      if (left === 0) { clearInterval(sleepTick); stepI = 0; btn.textContent = "Timer aus"; btn.classList.remove("on"); stop(); setStatus("Einschlaf-Timer beendet", false); return; }
      btn.textContent = "Noch " + Math.ceil(left / 60000) + " min";
    }
    tick(); sleepTick = setInterval(tick, 15000);
  });

  /* ---------- Sperrbildschirm-Steuerung ---------- */
  function updateMedia() {
    if (!("mediaSession" in navigator) || !current) return;
    try { navigator.mediaSession.metadata = new MediaMetadata({ title: "Technolovers " + current.name, artist: "Technolovers.fm", album: current.tag }); } catch (e) {}
  }
  if ("mediaSession" in navigator) {
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler("play", function () { if (!wantPlay) toggle(); });
      ms.setActionHandler("pause", function () { if (wantPlay) stop(); });
      ms.setActionHandler("nexttrack", function () { step(1); });
      ms.setActionHandler("previoustrack", function () { step(-1); });
    } catch (e) {}
  }

  /* ---------- Start ---------- */
  var barsEl = $("bars");
  for (var i = 0; i < 32; i++) { var b = document.createElement("span"); b.style.setProperty("--i", i); b.style.height = (40 + Math.abs(Math.sin(i * .7)) * 60) + "%"; barsEl.appendChild(b); }

  // Installierbare App: Service Worker nur über http(s) registrieren
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  renderChips(); renderGrid();
  var last = byId(store.get("last", ""));
  if (last) select(last.id, false);   // zuletzt gehörten Sender vorwählen, nicht automatisch starten
  else setHue("chill");
})();
</script>
</body>
</html>
